<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conditions de pousse — cèpes & girolles — Cévennes</title>
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <h1>Conditions de pousse</h1>
  <p class="sub">Cèpes &amp; girolles — 34 · 30 · 48 · 12 · 07 · 81. V1.</p>
  <fieldset>
    <label><input type="radio" name="layer" value="combine" checked> Combiné</label>
    <label><input type="radio" name="layer" value="cepe"> Cèpe</label>
    <label><input type="radio" name="layer" value="girolle"> Girolle</label>
  </fieldset>
  <label id="foretsRow"><input type="checkbox" id="forets" checked> Forêts domaniales (ONF)</label>
  <label><input type="checkbox" id="habitat" checked> Filtre habitat</label>
  <div class="row"><span>Jour&nbsp;:</span> <span id="dateLbl">—</span></div>
  <input type="range" id="dateSlider" min="20" max="77" value="74">
  <div id="status" class="sub"></div>
</div>
<div id="legend">
  <div>Indice — <b>vert = conditions réunies</b></div>
  <div class="bar"></div>
  <div class="lab"><span>0 défavorable</span><span>100</span></div>
</div>
<div id="map"></div>
<script src="assets/leaflet.js"></script>
<script src="data.js"></script>
<script type="module" src="app.mjs"></script>
</body>
</html>
