<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conditions de pousse — champignons Cévennes</title>
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <h1>Conditions de pousse <button id="helpBtn" title="Comment l'indice est calculé">?</button></h1>
  <p class="sub">Cévennes &amp; Sud-Massif central — 34 · 30 · 48 · 12 · 07 · 81.</p>
  <div class="row"><span>Espèce&nbsp;:</span> <select id="species"></select></div>
  <label id="foretsRow"><input type="checkbox" id="forets" checked> Forêts publiques (ONF)</label>
  <label style="margin-left:16px"><input type="checkbox" id="domOnly" checked> domaniales seules</label>
  <label id="brulisRow"><input type="checkbox" id="brulis" checked> Brûlis récents (morilles)</label>
  <label><input type="checkbox" id="habitat" checked> Filtre habitat</label>
  <div class="row"><span>Jour&nbsp;:</span> <span id="dateLbl">—</span></div>
  <input type="range" id="dateSlider" min="20" max="77" value="74">
  <div id="status" class="sub"></div>
</div>
<div id="legend">
  <div>Indice — <b>vert = conditions réunies</b></div>
  <div class="bar"></div>
  <div class="lab"><span>0 défavorable</span><span>100</span></div>
</div>
<div id="map"></div>

<div id="help" hidden>
  <div class="card">
    <button id="helpClose">×</button>
    <h2>Comment l'indice est calculé</h2>
    <p class="sub">Indice 0–100 par zone. <b>Vert = conditions réunies.</b>
      Détail complet : <code>MODELE.md</code> dans le dépôt.</p>
    <div id="helpBody"></div>
  </div>
</div>

<script src="assets/leaflet.js"></script>
<script src="data.js"></script>
<script type="module" src="app.mjs"></script>
<script>
  if ('serviceWorker' in navigator)
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
